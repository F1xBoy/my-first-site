<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat | Telegram Style</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="tg-container">
    <aside class="tg-sidebar">
        <div class="tg-search">
            <input type="text" placeholder="Поиск">
        </div>
        <div class="tg-contacts">
            <div class="tg-contact active">
                <div class="tg-avatar">V</div>
                <div class="tg-contact-info">
                    <div class="tg-name">V-Assistant</div>
                    <div class="tg-last-msg">Бот на связи</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="tg-chat">
        <header class="tg-chat-header">
            <div class="tg-chat-title">
                <strong>V-Assistant</strong>
                <span>bot</span>
            </div>
        </header>

        <div class="tg-messages" id="chatBox">
            <div class="msg-bubble system">Это начало вашей переписки с ботом VChat</div>
        </div>

        <div class="tg-input-area">
            <input type="text" id="userInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </main>
</div>

<script src="node.js"></script>
</body>
</html>
