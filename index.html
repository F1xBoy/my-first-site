<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nexus Terminal v2.7</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="terminal-window">
    <div class="window-header">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <button id="langBtn" class="lang-switch" onclick="toggleLang()">RU</button>
    </div>

    <div class="content">
        <h2 id="ui-title">AI Терминал</h2>
        <div class="subtitle" id="ui-subtitle">Connected to Gemini 1.5 Flash</div>
        
        <textarea id="userInput" placeholder="Напиши что-нибудь..."></textarea>
        
        <button id="execBtn" class="btn-execute" onclick="runAI()">ВЫПОЛНИТЬ ЗАПРОС</button>

        <div class="status-bar">
            <div id="loader" class="loader"></div>
            <span id="ui-status">Статус: Готов</span>
        </div>

        <div class="output-area" id="output">Результат появится здесь...</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
