<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat | Ultimate</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0e1621; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        * { box-sizing: border-box; }

        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14, 22, 33, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .auth-card { background: #17212b; padding: 25px; border-radius: 15px; width: 360px; border: 1px solid #2b5278; max-height: 90vh; overflow-y: auto; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #2b5278; background: #242f3d; color: white; outline: none; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #2b5278; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button.danger { background: #cc3333; }
        button.secondary { background: #313d4b; margin-top: 5px; }

        .tg-container { display: none; height: 100vh; width: 100vw; flex-direction: row; }
        .tg-sidebar { width: 300px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; }
        
        .profile-area { padding: 15px; background: #1c2936; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0e1621; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #58a6ff; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .item:hover { background: #242f3d; }
        .item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; }

        .tg-main { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
        .tg-header { padding: 12px 20px; background: #17212b; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; }
        .tg-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 70%; padding: 10px; border-radius: 12px; font-size: 14px; }
        .msg.user { align-self: flex-end; background: #2b5278; }
        .msg.other { align-self: flex-start; background: #182533; }
        .msg-sender { font-size: 10px; color: #58a6ff; display: block; margin-bottom: 3px; }

        .tg-input-area { padding: 15px; background: #17212b; display: flex; gap: 10px; }
        .info-label { font-size: 11px; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>VChat Ultimate</h2>
            <input type="email" id="uEmail" placeholder="Email">
            <input type="text" id="uNick" placeholder="Никнейм">
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <div id="user-modal" class="auth-overlay" style="display:none;">
        <div class="auth-card">
            <h3 id="modalUserTitle">Профиль</h3>
            <img id="modalUserAv" class="avatar" style="width:80px; height:80px; margin: 0 auto 15px; display:block;">
            
            <div id="myEditFields">
                <input type="text" id="myNickEdit" placeholder="Новый ник">
                <input type="text" id="myAvEdit" placeholder="Ссылка на аватар">
                <textarea id="myBioEdit" placeholder="О себе..."></textarea>
                <button onclick="saveMyProfile()">Сохранить</button>
            </div>
            
            <div id="otherViewFields" style="display:none; text-align: center;">
                <p id="viewEmail" style="color:#58a6ff; font-size:14px;"></p>
                <p id="viewBio" style="font-style:italic; font-size:13px;"></p>
            </div>

            <button class="secondary" onclick="closeModal('user-modal')">Закрыть</button>
        </div>
    </div>

    <div id="group-settings-modal" class="auth-overlay" style="display:none;">
        <div class="auth-card">
            <h3>Настройки группы</h3>
            <input type="text" id="gNameEdit" placeholder="Название">
            <input type="text" id="gAvEdit" placeholder="Ссылка на аватар">
            <textarea id="gDescEdit" placeholder="Описание группы..."></textarea>
            <select id="gPrivacy">
                <option value="public">Публичная</option>
                <option value="private">Приватная</option>
            </select>
            <hr>
            <span class="info-label">Добавить по Нику или Email:</span>
            <input type="text" id="addMemberInput" placeholder="Ник или почта">
            <button class="secondary" onclick="addMember()">Добавить участника</button>
            <hr>
            <button onclick="saveGroupSettings()">Сохранить</button>
            <button class="danger" onclick="deleteGroup()">УДАЛИТЬ ГРУППУ</button>
            <button class="secondary" onclick="closeModal('group-settings-modal')">Назад</button>
        </div>
    </div>

    <div id="main-app" class="tg-container">
        <aside class="tg-sidebar">
            <div class="profile-area">
                <img id="myAv" class="avatar" src="" onclick="openProfile(true)">
                <div id="myNameDisplay" style="font-weight:bold">...</div>
            </div>
            <div style="padding:10px; display:flex; gap:5px;">
                <input type="text" id="search" placeholder="Поиск..." oninput="drawList()" style="margin:0">
                <button onclick="initGroup()" style="width:40px">+</button>
            </div>
            <div class="chat-list" id="list"></div>
        </aside>

        <main class="tg-main">
            <header class="tg-header">
                <div style="display:flex; flex-direction:column;">
                    <span id="activeTitle" style="font-weight:bold">Выбери чат</span>
                    <small id="activeDesc" style="font-size:10px; color:#888"></small>
                </div>
                <button id="gSetBtn" style="display:none; width:auto; padding:5px 10px;" onclick="openGSettings()">⚙ Настроить</button>
            </header>
            <div id="chatBox" class="tg-messages"></div>
            <div class="tg-input-area">
                <input type="text" id="mInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') send()">
                <button onclick="send()" style="width:50px">➤</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCg30e6q0vgQifYTXgl7ERe7aC-ZrLaOiY",
            authDomain: "vchat-12103.firebaseapp.com",
            databaseURL: "https://vchat-12103-default-rtdb.firebaseio.com",
            projectId: "vchat-12103",
            storageBucket: "vchat-12103.firebasestorage.app",
            messagingSenderId: "734798044186",
            appId: "1:734798044186:web:4b81505707c1b3a03a05a3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myKey = localStorage.getItem('vchat_key') || "";
        let curChat = null; 
        let cache = { users: {}, groups: {} };

        function login() {
            const e = document.getElementById('uEmail').value.trim().toLowerCase();
            const n = document.getElementById('uNick').value.trim();
            if (e && n) {
                myKey = btoa(e).replace(/=/g, "");
                db.ref("users/" + myKey).update({ nickname: n, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=" + n, email: e, bio: "Всем привет!" });
                localStorage.setItem('vchat_key', myKey);
                location.reload();
            }
        }

        window.onload = () => {
            if (!myKey) return;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            db.ref("users/" + myKey).on("value", s => {
                const d = s.val();
                document.getElementById('myNameDisplay').innerText = d.nickname;
                document.getElementById('myAv').src = d.avatar;
            });

            db.ref("users").on("value", s => { cache.users = s.val(); drawList(); });
            db.ref("groups").on("value", s => { cache.groups = s.val(); drawList(); });
        };

        function drawList() {
            const cont = document.getElementById('list');
            const q = document.getElementById('search').value.toLowerCase();
            cont.innerHTML = "";

            for (let id in cache.groups) {
                const g = cache.groups[id];
                const isMem = g.members && g.members[myKey];
                if (g.privacy === 'private' && g.owner !== myKey && !isMem) continue;
                if (g.name.toLowerCase().includes(q)) addItem(cont, g.name, g.avatar, id, 'GROUP');
            }
            for (let id in cache.users) {
                if (id === myKey) continue;
                const u = cache.users[id];
                if (u.nickname.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) addItem(cont, u.nickname, u.avatar, id, 'USER');
            }
        }

        function addItem(cont, name, av, id, type) {
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = () => selectChat(id, name, type, av);
            div.innerHTML = `<img src="${av || 'https://api.dicebear.com/7.x/identicon/svg?seed='+id}">
                             <div style="flex:1"><b>${name}</b><br><small style="color:#58a6ff;font-size:9px">${type}</small></div>
                             <button style="width:25px;height:25px;padding:0;font-size:10px" onclick="event.stopPropagation(); openProfile(false, '${id}', '${type}')">i</button>`;
            cont.appendChild(div);
        }

        function selectChat(id, name, type, av) {
            curChat = { id, name, type };
            document.getElementById('activeTitle').innerText = name;
            document.getElementById('activeDesc').innerText = type === 'GROUP' ? (cache.groups[id].desc || "") : "";
            document.getElementById('chatBox').innerHTML = "";
            
            const isOwner = type === 'GROUP' && cache.groups[id].owner === myKey;
            document.getElementById('gSetBtn').style.display = isOwner ? 'block' : 'none';

            const chatPath = type === 'USER' ? (myKey < id ? myKey+"_"+id : id+"_"+myKey) : id;
            db.ref("msgs/" + chatPath).off();
            db.ref("msgs/" + chatPath).on("child_added", s => {
                // ПРОВЕРКА ПРИВАТНОСТИ В МОМЕНТЕ
                if (type === 'GROUP') {
                    const g = cache.groups[id];
                    const isMem = g.members && g.members[myKey];
                    if (g.privacy === 'private' && g.owner !== myKey && !isMem) {
                        document.getElementById('chatBox').innerHTML = "<p style='text-align:center;color:red'>Доступ закрыт</p>";
                        return;
                    }
                }
                const m = s.val();
                const d = document.createElement('div');
                d.className = 'msg ' + (m.sid === myKey ? 'user' : 'other');
                d.innerHTML = `<small class="msg-sender">${m.snick}</small>${m.txt}`;
                document.getElementById('chatBox').appendChild(d);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        // ПРОФИЛИ
        function openProfile(isMe, id, type) {
            const modal = document.getElementById('user-modal');
            modal.style.display = 'flex';
            
            if (isMe) {
                const d = cache.users[myKey];
                document.getElementById('modalUserTitle').innerText = "Настройки профиля";
                document.getElementById('modalUserAv').src = d.avatar;
                document.getElementById('myEditFields').style.display = 'block';
                document.getElementById('otherViewFields').style.display = 'none';
                document.getElementById('myNickEdit').value = d.nickname;
                document.getElementById('myAvEdit').value = d.avatar;
                document.getElementById('myBioEdit').value = d.bio || "";
            } else {
                document.getElementById('myEditFields').style.display = 'none';
                document.getElementById('otherViewFields').style.display = 'block';
                if (type === 'USER') {
                    const u = cache.users[id];
                    document.getElementById('modalUserTitle').innerText = u.nickname;
                    document.getElementById('modalUserAv').src = u.avatar;
                    document.getElementById('viewEmail').innerText = u.email;
                    document.getElementById('viewBio').innerText = u.bio || "Нет описания";
                }
            }
        }

        function saveMyProfile() {
            db.ref("users/" + myKey).update({
                nickname: document.getElementById('myNickEdit').value,
                avatar: document.getElementById('myAvEdit').value,
                bio: document.getElementById('myBioEdit').value
            });
            closeModal('user-modal');
        }

        // ГРУППЫ
        function addMember() {
            const input = document.getElementById('addMemberInput').value.trim().toLowerCase();
            let foundKey = null;
            for (let id in cache.users) {
                if (cache.users[id].email.toLowerCase() === input || cache.users[id].nickname.toLowerCase() === input) {
                    foundKey = id; break;
                }
            }
            if (foundKey) {
                db.ref("groups/" + curChat.id + "/members/" + foundKey).set(true);
                alert("Участник добавлен!");
                document.getElementById('addMemberInput').value = "";
            } else { alert("Пользователь не найден"); }
        }

        function saveGroupSettings() {
            db.ref("groups/" + curChat.id).update({
                name: document.getElementById('gNameEdit').value,
                avatar: document.getElementById('gAvEdit').value,
                privacy: document.getElementById('gPrivacy').value,
                desc: document.getElementById('gDescEdit').value
            });
            closeModal('group-settings-modal');
        }

        function initGroup() {
            const n = prompt("Имя группы:");
            if (n) {
                const id = "grp_" + Date.now();
                db.ref("groups/" + id).set({ name: n, owner: myKey, privacy: 'public', avatar: "", desc: "Новая группа", members: { [myKey]: true } });
            }
        }

        function openGSettings() {
            const g = cache.groups[curChat.id];
            document.getElementById('gNameEdit').value = g.name;
            document.getElementById('gAvEdit').value = g.avatar;
            document.getElementById('gPrivacy').value = g.privacy;
            document.getElementById('gDescEdit').value = g.desc || "";
            document.getElementById('group-settings-modal').style.display = 'flex';
        }

        function send() {
            const txt = document.getElementById('mInput').value.trim();
            if (!txt || !curChat) return;
            db.ref("msgs/" + (curChat.type === 'USER' ? (myKey < curChat.id ? myKey+"_"+curChat.id : curChat.id+"_"+myKey) : curChat.id)).push().set({
                sid: myKey, snick: document.getElementById('myNameDisplay').innerText, txt: txt, time: Date.now()
            });
            document.getElementById('mInput').value = "";
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function deleteGroup() { if (confirm("Удалить?")) { db.ref("groups/"+curChat.id).remove(); db.ref("msgs/"+curChat.id).remove(); location.reload(); } }
    </script>
</body>
</html>
