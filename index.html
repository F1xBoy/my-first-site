<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat | Messaging</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="vchat-app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>VChat</h2>
        </div>
        <div class="contacts">
            <div class="contact active">
                <div class="avatar">V</div>
                <div class="contact-info">
                    <span class="name">V-Assistant</span>
                    <span class="status">online</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="chat-window">
        <header class="chat-header">
            <div class="chat-info">
                <span class="chat-name">V-Assistant</span>
            </div>
        </header>

        <div class="messages-container" id="chatBox">
            <div class="message system">Добро пожаловать в VChat! Напиши что-нибудь своему ассистенту.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
