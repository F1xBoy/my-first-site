<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="login-screen" class="modal">
        <div class="modal-content">
            <h2>Добро пожаловать в VChat</h2>
            <p>Никакой цензуры. Только общение.</p>
            <input type="email" id="userEmail" placeholder="Твой E-mail">
            <button onclick="enterChat()">Войти в чат</button>
        </div>
    </div>

    <div class="tg-container blur" id="main-app">
        <aside class="tg-sidebar">
            <div class="tg-header">VChat v1.0</div>
            <div class="tg-contacts">
                <div class="tg-contact active">
                    <div class="tg-avatar">#</div>
                    <div class="tg-info">
                        <strong>Общий чат</strong>
                        <span>Все онлайн</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="tg-main">
            <div class="tg-chat-header" id="currentUserName">Чат</div>
            <div class="tg-messages" id="chatBox">
                <div class="msg system">Сообщения защищены (наверное)</div>
            </div>
            <div class="tg-input-area">
                <input type="text" id="userInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">➤</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="node.js"></script>
</body>
</html>
