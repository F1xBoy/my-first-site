<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tech Translator</title>
    <style>
        /* Минималистичный "космический" дизайн */
        body { background: #f0f2f5; color: #1c1e21; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .app-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #007bff; font-size: 24px; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; border: 2px solid #e4e6eb; border-radius: 10px; padding: 10px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 15px 25px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; min-height: 50px; font-style: italic; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>AI Translator Lite 🤖</h1>
    <textarea id="inputText" placeholder="Введи английский текст..."></textarea>
    <button onclick="translateText()">Перевести магией JS</button>
    <div id="result">Результат появится здесь...</div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value;
        const resultDiv = document.getElementById('result');
        
        if(!text) {
            resultDiv.innerText = "Сначала введи текст, бро!";
            return;
        }

        resultDiv.innerText = "Думаю...";

        // Используем бесплатный API для перевода
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`);
            const data = await res.json();
            resultDiv.innerText = data.responseData.translatedText;
        } catch (error) {
            resultDiv.innerText = "Ошибка связи с сервером. Попробуй позже!";
        }
    }
</script>

</body>
</html>
