<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Logic Terminal</title>
    <!-- Подключаем шрифт для кода -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;
            --success: #3fb950;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-window {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Шапка окна */
        .window-header {
            background: #21262d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .lang-switch {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* Контент */
        .content {
            padding: 25px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: var(--accent);
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            color: #79c0ff;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn-execute {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-execute:hover {
            opacity: 0.9;
        }

        .output-area {
            margin-top: 25px;
            background: #010409;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #d1d5da;
            white-space: pre-wrap;
        }

        .status-bar {
            margin-top: 15px;
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="terminal-window">
    <div class="window-header">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <button id="langBtn" class="lang-switch" onclick="toggleLang()">RU</button>
    </div>

    <div class="content">
        <h2 id="title">Система анализа кода</h2>
        <textarea id="userInput" placeholder="Введите ваш код или запрос к AI..."></textarea>
        
        <button id="execBtn" class="btn-execute" onclick="runAI()">ВЫПОЛНИТЬ ЗАПРОС</button>

        <div class="status-bar" id="status">Статус: Готов к работе</div>
        <div class="output-area" id="output">Результат вычислений появится здесь...</div>
    </div>
</div>

<script>
    let currentLang = 'RU';

    const translations = {
        RU: {
            title: "Система анализа кода",
            placeholder: "Введите ваш код или запрос к AI...",
            btn: "ВЫПОЛНИТЬ ЗАПРОС",
            status: "Статус: Готов к работе",
            wait: "Обработка данных через нейронную сеть...",
            empty: "Ошибка: Поле ввода пусто!",
            res: "Результат вычислений появится здесь..."
        },
        EN: {
            title: "AI Logic Terminal",
            placeholder: "Enter your code or prompt for AI...",
            btn: "EXECUTE COMMAND",
            status: "Status: Ready",
            wait: "Processing data via neural network...",
            empty: "Error: Input is empty!",
            res: "Result will appear here..."
        }
    };

    function toggleLang() {
        currentLang = currentLang === 'RU' ? 'EN' : 'RU';
        document.getElementById('langBtn').innerText = currentLang;
        updateUI();
    }

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('title').innerText = t.title;
        document.getElementById('userInput').placeholder = t.placeholder;
        document.getElementById('execBtn').innerText = t.btn;
        document.getElementById('status').innerText = t.status;
        document.getElementById('output').innerText = t.res;
    }

    async function runAI() {
        const input = document.getElementById('userInput').value;
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const t = translations[currentLang];

        if (!input.trim()) {
            output.innerText = t.empty;
            return;
        }

        status.innerText = t.wait;
        output.innerText = "...";

        // Симуляция работы нейронки (здесь в будущем будет реальный API)
        setTimeout(() => {
            status.innerText = currentLang === 'RU' ? "Завершено" : "Completed";
            output.innerText = `[AI System]: Запрос принят. Анализ завершен.\n\nДанные: "${input.substring(0, 50)}..."\n\nДля активации полноценного интеллекта нужно подключить API-ключ в следующем обновлении.`;
        }, 1500);
    }
</script>

</body>
</html>
