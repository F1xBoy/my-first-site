<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat | Ultimate</title>
    <style>
        /* ОСНОВНЫЕ СТИЛИ */
        body, html { margin: 0; padding: 0; height: 100%; background: #0e1621; color: white; font-family: 'Roboto', sans-serif; overflow: hidden; }
        
        /* ЭКРАНЫ АВТОРИЗАЦИИ И НАСТРОЕК */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0e1621; display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .auth-card { background: #17212b; padding: 30px; border-radius: 15px; text-align: center; width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2b5278; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #2b5278; background: #242f3d; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #2b5278; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #3b6a99; }

        /* КОНТЕЙНЕР ПРИЛОЖЕНИЯ */
        .tg-container { display: none; height: 100vh; width: 100vw; flex-direction: row; }
        
        /* САЙДБАР */
        .tg-sidebar { width: 320px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; }
        .profile-section { padding: 20px; border-bottom: 1px solid #0e1621; background: #1c2936; display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: #58a6ff; cursor: pointer; object-fit: cover; border: 2px solid transparent; }
        .user-avatar:hover { border-color: #58a6ff; }

        /* СПИСОК ЮЗЕРОВ */
        .chat-list { flex: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-item:hover { background: #242f3d; }
        .user-item img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; background: #0e1621; }
        .user-item .nick { font-weight: bold; font-size: 14px; display: block; }
        .user-item .mail { font-size: 11px; color: #8b949e; }

        /* ГЛАВНОЕ ОКНО ЧАТА */
        .tg-main { flex: 1; display: flex; flex-direction: column; background: #0e1621; position: relative; }
        .tg-header { padding: 15px 20px; background: #17212b; font-weight: bold; display: flex; align-items: center; gap: 12px; z-index: 10; }
        
        .tg-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: contain; }
        
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg.user { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: #182533; border-bottom-left-radius: 4px; }

        .tg-input-area { padding: 15px; background: #17212b; display: flex; gap: 10px; align-items: center; }
        
        /* МАЛЕНЬКИЕ АВАТАРКИ В НАСТРОЙКАХ */
        .mini-av { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .mini-av:hover { border-color: #58a6ff; }
    </style>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2 style="color:#58a6ff">VChat</h2>
            <p>Мессенджер для своих</p>
            <input type="email" id="userEmail" placeholder="Ваш Email">
            <input type="text" id="userNickname" placeholder="Ваш Никнейм">
            <button onclick="enterChat()">Создать аккаунт / Войти</button>
        </div>
    </div>

    <div id="settings-modal" class="auth-overlay" style="display:none;">
        <div class="auth-card">
            <h3>Профиль</h3>
            <input type="text" id="editNickname" placeholder="Новый ник">
            <input type="text" id="editAvatarUrl" placeholder="Ссылка на фото (URL)">
            <p style="font-size:11px; color:#8b949e">Или выбери стиль:</p>
            <div style="display:flex; justify-content: space-around; margin-bottom: 20px;">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky" class="mini-av" onclick="setFastAv('Lucky')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Milo" class="mini-av" onclick="setFastAv('Milo')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bear" class="mini-av" onclick="setFastAv('Bear')">
            </div>
            <div style="display:flex; gap:10px">
                <button onclick="saveProfile()">ОК</button>
                <button onclick="closeSettings()" style="background:#cc3333">Отмена</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="tg-container">
        <aside class="tg-sidebar">
            <div class="profile-section">
                <img id="myAvatar" class="user-avatar" src="" title="Настройки" onclick="openSettings()">
                <div>
                    <div id="myName" style="font-weight:bold; font-size:15px">Никнейм</div>
                    <small style="color:#58a6ff">онлайн</small>
                </div>
            </div>
            <div style="padding: 10px;">
                <input type="text" id="searchInput" placeholder="Поиск людей..." oninput="filterUsers()">
            </div>
            <div class="chat-list" id="userList"></div>
        </aside>

        <main class="tg-main">
            <header class="tg-header">
                <img id="activeChatAvatar" src="" style="width:35px; height:35px; border-radius:50%; display:none;">
                <span id="chatTitle">Выберите чат слева</span>
            </header>
            <div id="chatBox" class="tg-messages"></div>
            <div class="tg-input-area">
                <input type="text" id="userInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" style="width:auto; background:none; color:#58a6ff; font-size:26px;">➤</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="node.js"></script>
</body>
</html>
