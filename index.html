<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h1>VChat</h1>
            <input type="email" id="userEmail" placeholder="Твой Email">
            <button onclick="enterChat()">Войти</button>
        </div>
    </div>

    <div class="tg-container" id="main-app" style="display:none;">
        <aside class="tg-sidebar">
            <div class="sidebar-header">VChat</div>
            <div class="tg-contacts">
                <div class="tg-contact active">Общий чат</div>
            </div>
        </aside>
        <main class="tg-main">
            <header class="tg-chat-header" id="userTitle">Чат</header>
            <div class="tg-messages" id="chatBox"></div>
            <div class="tg-input-area">
                <input type="text" id="userInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">➤</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="node.js"></script>
</body>
</html>
