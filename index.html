<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nexus Translator</title>
    <!-- Подключаем современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .app-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.025em;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.2);
        }

        button:hover {
            background: #7dd3fc;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 32px;
            text-align: left;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        #result {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 12px;
            min-height: 60px;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: var(--accent-color); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 var(--accent-color), .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 var(--accent-color), .5em 0 0 var(--accent-color); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Nexus AI</h1>
    <div class="subtitle">Умный перевод технологических текстов</div>
    
    <div class="input-group">
        <label>Input Text (English)</label>
        <textarea id="inputText" placeholder="Paste your text here..."></textarea>
    </div>

    <button id="mainBtn" onclick="translateText()">Translate Now</button>

    <div class="result-container">
        <label>Translation Result</label>
        <div id="result">Waiting for input...</div>
    </div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value;
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('mainBtn');
        
        if(!text.trim()) {
            resultDiv.innerText = "Please enter some text first.";
            return;
        }

        // Визуальный фидбек
        btn.disabled = true;
        btn.innerText = "Processing...";
        resultDiv.innerHTML = '<span class="loading-dots">Neural network is thinking</span>';

        try {
            // MyMemory API — бесплатный и не требует ключа
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`);
            const data = await res.json();
            
            if (data.responseData) {
                resultDiv.innerText = data.responseData.translatedText;
            } else {
                resultDiv.innerText = "Translation error. Try again.";
            }
        } catch (error) {
            resultDiv.innerText = "Error: Connection lost.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Translate Now";
        }
    }
</script>

</body>
</html>
