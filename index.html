<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VChat 6.2</title>
    <meta name="google-site-verification" content="bnrGuCFyUfxc7XB3jmiLYsr6mbgod0QWt2PHqIXGSrg" />
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* Цветовые переменные для Темной и Светлой темы */
        :root {
            --bg-main: #0e1621;
            --bg-card: #17212b;
            --bg-input: #242f3d;
            --bg-hover: #1c2936;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2b5278;
            --accent: #58a6ff;
            --msg-me: #2b5278;
            --msg-he: #182533;
            --danger: #ff6b6b;
            --success: #2ea043;
        }

        body.light-mode {
            --bg-main: #e2e8f0;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --bg-hover: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent: #2563eb;
            --msg-me: #dbeafe;
            --msg-he: #ffffff;
            --danger: #ef4444;
            --success: #16a34a;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', sans-serif; overflow: hidden; transition: background 0.3s, color 0.3s; }
        * { box-sizing: border-box; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes msgIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.2s ease-out forwards; }
        .modal-card { background: var(--bg-card); padding: 25px; border-radius: 12px; width: 380px; border: 1px solid var(--border-color); animation: slideUp 0.25s ease-out forwards; max-height: 90vh; overflow-y: auto; color: var(--text-main); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); outline: none; transition: 0.2s ease; }
        input:focus, textarea:focus { border-color: var(--accent); }

        button { width: 100%; padding: 10px; background: var(--border-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        button.danger { background: var(--danger); }
        button.success { background: var(--success); }
        button.secondary { background: var(--bg-input); color: var(--text-main); padding: 6px 12px; font-size: 13px; width: auto; border: 1px solid var(--border-color); }

        .tg-container { display: none; height: 100vh; width: 100vw; flex-direction: row; }
        .tg-sidebar { width: 300px; background: var(--bg-card); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        
        .profile-header { padding: 15px; background: var(--bg-hover); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid var(--accent); }
        
        /* Вкладки */
        .tabs { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--text-muted); transition: 0.2s; border-bottom: 3px solid transparent; user-select: none; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid var(--bg-main); transition: background 0.1s; }
        .chat-item:hover { background: var(--bg-hover); }
        .chat-item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; }

        .tg-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .header { padding: 10px 20px; background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; height: 65px; border-bottom: 1px solid var(--border-color); }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14px; word-wrap: break-word; position: relative; animation: msgIn 0.2s ease-out forwards; }
        .msg.me { align-self: flex-end; background: var(--msg-me); color: var(--text-main); }
        .msg.he { align-self: flex-start; background: var(--msg-he); color: var(--text-main); border: 1px solid var(--border-color); }
        .msg-name { font-size: 10px; color: var(--accent); font-weight: bold; margin-bottom: 4px; }
        .msg-del { display: none; color: var(--danger); cursor: pointer; margin-left: 8px; font-size: 11px; float: right; }
        .msg:hover .msg-del { display: inline-block; }

        .input-bar { padding: 15px; background: var(--bg-card); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border-color); }
        
        .p-info-label { font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: bold; margin-top: 10px; margin-bottom: 3px; display: block; }
        .device-item { background: var(--bg-input); padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        
        .block-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; color:#fff; font-weight:bold; z-index:10; display:none; }
    </style>
</head>
<body>

    <div id="login-scr" class="modal-overlay" style="display: flex;">
        <div class="modal-card" style="text-align: center;">
            <h2 style="color:var(--accent); margin-top:0;">Вход в VChat</h2>
            <input type="email" id="uEmail" placeholder="Email">
            <input type="password" id="uPass" placeholder="Пароль">
            <button class="success" onclick="login()" style="margin-top: 10px;">Войти</button>
            <button class="secondary" style="width:100%; margin-top:10px; background:#fff; color:#000;" onclick="loginWithGoogle()">Войти через Google</button>
            <p style="font-size: 13px; color: var(--accent); cursor: pointer; text-decoration: underline;" onclick="document.getElementById('login-view').style.display='none'; document.getElementById('reg-view').style.display='block';">Нет аккаунта? Зарегистрироваться</p>
        </div>
        
        <div class="modal-card" id="reg-view" style="display: none; position: absolute; text-align: center;">
            <h2 style="color:var(--success); margin-top:0;">Регистрация</h2>
            <input type="text" id="uNick" placeholder="Никнейм">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPass" placeholder="Пароль">
            <input type="password" id="regPin" placeholder="4-значный ПИН (необязательно)" maxlength="4" style="text-align:center;">
            <button class="success" onclick="register()">Создать</button>
            <p style="font-size: 13px; color: var(--accent); cursor: pointer;" onclick="document.getElementById('reg-view').style.display='none';">Назад ко входу</p>
        </div>

        <div class="modal-card" id="pin-view" style="display: none; position: absolute; text-align: center;">
            <h2 style="color:var(--accent); margin-top:0;">Защита аккаунта 🔒</h2>
            <input type="password" id="authPinInp" placeholder="••••" maxlength="4" style="text-align:center; font-size:26px; letter-spacing:10px; width:160px; margin:15px auto;" onkeydown="if(event.key==='Enter') verifyPin()">
            <button class="success" onclick="verifyPin()">Войти ➤</button>
        </div>
    </div>

    <div id="my-prof-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin-top:0; color:var(--accent);">Мой Аккаунт</h3>
            <img id="myAvPreview" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; display:block; margin: 0 auto; border: 2px solid var(--accent);">
            
            <label class="p-info-label">Никнейм</label>
            <input type="text" id="myNickNew">
            <label class="p-info-label">Аватар (URL)</label>
            <input type="text" id="myAvNew">
            <button class="success" onclick="updateMe()">Сохранить профиль</button>

            <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
            <span class="p-info-label">💻 Активные сессии (Устройства)</span>
            <div id="devices-list" style="max-height: 150px; overflow-y: auto;"></div>

            <button class="secondary" style="width:100%; margin-top:15px;" onclick="closeM('my-prof-modal')">Закрыть</button>
            <button class="danger" style="margin-top:8px;" onclick="logOut()">Выйти из аккаунта</button>
        </div>
    </div>

    <div id="user-prof-modal" class="modal-overlay">
        <div class="modal-card">
            <img id="pCardAv" style="width:80px; height:80px; border-radius:50%; display:block; margin:0 auto 10px; object-fit:cover; border:2px solid var(--accent);">
            <h3 id="pCardNick" style="text-align: center; margin: 0 0 15px 0; color: var(--accent);">Никнейм</h3>
            
            <div style="background:var(--bg-input); padding:15px; border-radius:8px; border:1px solid var(--border-color);">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:bold;">
                    <input type="checkbox" id="isContact" style="width:auto; margin:0;" onchange="toggleContactSettings()"> 
                    Добавить в Мои Контакты 📒
                </label>
                <div id="contactSettings" style="display:none; margin-top:10px; border-top:1px dashed var(--border-color); padding-top:10px;">
                    <small style="color:var(--text-muted);">Локальное имя (видишь только ты):</small>
                    <input type="text" id="contactLocName" placeholder="Бро / Брат / Кент">
                    <small style="color:var(--text-muted);">Локальная аватарка (URL):</small>
                    <input type="text" id="contactLocAv" placeholder="https://...">
                    <button class="success" style="padding:6px; font-size:12px;" onclick="saveContact()">Сохранить контакт</button>
                </div>
            </div>

            <button id="blockBtn" class="danger" style="margin-top:15px;" onclick="toggleBlock()">🚫 Заблокировать пользователя</button>
            <button class="secondary" style="width:100%; margin-top:8px;" onclick="closeM('user-prof-modal')">Закрыть</button>
        </div>
    </div>

    <div id="app" class="tg-container">
        <aside class="tg-sidebar">
            <div class="profile-header">
                <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="openMe()">
                    <img id="myAvImg" class="avatar" src="">
                    <div id="myName" style="font-weight:bold;">Загрузка...</div>
                </div>
                <button class="secondary" style="border-radius:50%; width:35px; height:35px; padding:0; font-size:16px;" onclick="toggleTheme()" id="themeBtn">🌙</button>
            </div>
            
            <div style="padding:10px; display:flex; gap:5px;">
                <input type="text" id="srch" placeholder="Поиск..." oninput="render()" style="margin:0">
                <button class="success" onclick="newG()" style="width:40px; margin:0; font-size:18px;">+</button>
            </div>

            <div class="tabs">
                <div class="tab-btn active" onclick="setTab('chats', this)">Чаты</div>
                <div class="tab-btn" onclick="setTab('groups', this)">Группы</div>
                <div class="tab-btn" onclick="setTab('contacts', this)">Контакты</div>
            </div>

            <div class="chat-list" id="chatList"></div>
        </aside>

        <main class="tg-main" style="position:relative;">
            <header class="header">
                <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="openUserCardFromHeader()">
                    <img id="hAv" src="" style="width:35px; height:35px; border-radius:50%; display:none; object-fit: cover;">
                    <div>
                        <b id="hTitle">Выберите чат</b><br>
                        <small id="hDesc" style="color:var(--text-muted);font-size:11px"></small>
                    </div>
                </div>
            </header>
            
            <div id="msgBox" class="messages"></div>
            
            <div id="blockOverlay" class="block-overlay">Вы заблокировали этого пользователя</div>

            <div class="input-bar">
                <input type="text" id="msgInp" placeholder="Написать..." onkeydown="if(event.key==='Enter') sendMsg()" style="margin:0;">
                <button onclick="sendMsg()" style="width:55px; margin:0; background: var(--accent); color: #fff;">➤</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <script>
        const cfg = {
            apiKey: "AIzaSyCg30e6q0vgQifYTXgl7ERe7aC-ZrLaOiY",
            databaseURL: "https://vchat-12103-default-rtdb.firebaseio.com",
            projectId: "vchat-12103",
            authDomain: "vchat-12103.firebaseapp.com"
        };
        firebase.initializeApp(cfg);
        const db = firebase.database();
        const authSystem = firebase.auth();

        let myID = "";
        let active = null;
        let currentTab = 'chats';
        let sessionId = "";
        
        let cache = { u: {}, g: {}, contacts: {}, blocked: {} };

        // ТЕМА
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); document.getElementById('themeBtn').innerText = '🌞'; }
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').innerText = isLight ? '🌞' : '🌙';
        }

        authSystem.onAuthStateChanged(user => {
            if (user) {
                myID = user.uid;
                
                // Инициализация юзера
                db.ref("users/" + myID).on("value", s => {
                    const d = s.val();
                    if(!d) {
                        db.ref("users/" + myID).set({ nickname: user.email.split('@')[0], avatar: "", email: user.email || "" });
                        document.getElementById('login-scr').style.display = 'none'; document.getElementById('app').style.display = 'flex';
                    } else {
                        document.getElementById('myName').innerText = d.nickname;
                        document.getElementById('myAvImg').src = d.avatar || "https://api.dicebear.com/7.x/identicon/svg?seed="+myID;
                        
                        cache.contacts = d.contacts || {};
                        cache.blocked = d.blocked || {};

                        if (d.pin && d.pin.trim() !== "" && sessionStorage.getItem('vchat_pin_pass') !== 'true') {
                            document.getElementById('login-scr').style.display = 'flex';
                            document.getElementById('login-view').style.display = 'none';
                            document.getElementById('pin-view').style.display = 'block';
                            document.getElementById('authPinInp').focus();
                        } else {
                            document.getElementById('login-scr').style.display = 'none'; document.getElementById('app').style.display = 'flex';
                            registerSession(); // Регаем девайс только после успешного входа
                        }
                    }
                });

                db.ref("users").on("value", s => { cache.u = s.val() || {}; render(); });
                db.ref("groups").on("value", s => { cache.g = s.val() || {}; render(); });
            } else {
                myID = ""; sessionStorage.clear();
                document.getElementById('login-scr').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        // СЕССИИ (АНТИ-ВТЫК)
        function registerSession() {
            if (sessionId) return;
            sessionId = "sess_" + Date.now() + "_" + Math.floor(Math.random()*1000);
            
            // Парсим ОС и Браузер
            let os = "Неизвестное устройство"; let browser = "Неизвестный браузер";
            let ua = navigator.userAgent;
            if (ua.includes("Win")) os = "Windows PC"; else if (ua.includes("Mac") && !ua.includes("iPhone")) os = "macOS"; else if (ua.includes("Android")) os = "Android Смартфон"; else if (ua.includes("iPhone")) os = "iPhone";
            if (ua.includes("Chrome")) browser = "Chrome"; else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari"; else if (ua.includes("Firefox")) browser = "Firefox";

            let sessionRef = db.ref(`users/${myID}/sessions/${sessionId}`);
            sessionRef.set({ os: os, browser: browser, time: new Date().toLocaleString() });
            sessionRef.onDisconnect().remove(); // Авто-удаление при закрытии вкладки

            // Слушаем, не кикнули ли нас с другого устройства
            sessionRef.on("value", snap => {
                if (snap.val() === null && myID) {
                    alert("Вас кикнули с другого устройства! Сессия завершена.");
                    authSystem.signOut();
                }
            });
        }

        function loadDevices() {
            const list = document.getElementById('devices-list'); list.innerHTML = "Загрузка...";
            db.ref(`users/${myID}/sessions`).once("value", s => {
                list.innerHTML = "";
                const sessions = s.val() || {};
                for(let sid in sessions) {
                    const data = sessions[sid];
                    const isMe = (sid === sessionId);
                    list.innerHTML += `
                        <div class="device-item">
                            <div><b>${data.os}</b> <small style="color:var(--accent);">(${data.browser})</small><br>
                            <small style="color:var(--text-muted); font-size:10px;">Вход: ${data.time}</small></div>
                            ${isMe ? '<span style="background:var(--success); color:#fff; padding:3px 6px; border-radius:4px; font-size:10px;">Текущий</span>' 
                                   : `<button class="danger" style="width:auto; padding:5px 10px; font-size:11px; margin:0;" onclick="kickSession('${sid}')">Кикнуть</button>`}
                        </div>`;
                }
            });
        }

        function kickSession(sid) {
            if(confirm("Выкинуть это устройство из аккаунта?")) {
                db.ref(`users/${myID}/sessions/${sid}`).remove().then(()=> loadDevices());
            }
        }

        // ВКЛАДКИ
        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            render();
        }

        // РЕНДЕР И ФИЛЬТРАЦИЯ
        function getUserDisplayData(uid) {
            const baseUser = cache.u[uid];
            if (!baseUser) return { name: "Неизвестный", avatar: "" };
            
            // Если он в моих контактах, переопределяем
            if (cache.contacts[uid]) {
                return {
                    name: cache.contacts[uid].locName || baseUser.nickname,
                    avatar: cache.contacts[uid].locAv || baseUser.avatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${uid}`,
                    isContact: true
                };
            }
            return { name: baseUser.nickname, avatar: baseUser.avatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${uid}`, isContact: false };
        }

        function render() {
            const list = document.getElementById('chatList'); 
            const q = document.getElementById('srch').value.toLowerCase(); 
            list.innerHTML = "";

            if (currentTab === 'groups' || currentTab === 'chats') {
                for (let id in cache.g) {
                    const g = cache.g[id]; 
                    if (g.roles && g.roles[myID] && g.name.toLowerCase().includes(q) && currentTab === 'groups') {
                        addLi(list, g.name, g.avatar || `https://api.dicebear.com/7.x/shapes/svg?seed=${id}`, id, 'GROUP');
                    }
                }
            }
            
            for (let id in cache.u) {
                if (id === myID) continue;
                const dData = getUserDisplayData(id);
                
                // Не показываем заблокированных в общем списке, если это не поиск или вкладка контактов
                if (cache.blocked[id] && currentTab === 'chats' && !q) continue; 

                if (dData.name.toLowerCase().includes(q)) {
                    if (currentTab === 'contacts' && !dData.isContact) continue; // Во вкладке контактов только контакты
                    if (currentTab === 'groups') continue; // В группах юзеров нет
                    
                    let suffix = cache.blocked[id] ? " (ЗАБЛОКИРОВАН)" : (dData.isContact ? " 📒" : "");
                    addLi(list, dData.name + suffix, dData.avatar, id, 'USER');
                }
            }
        }

        function addLi(cont, name, av, id, type) {
            const d = document.createElement('div'); d.className = 'chat-item'; d.onclick = () => select(id, name, type);
            d.innerHTML = `<img src="${av}"><div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>${name}</b><br><small style="color:var(--text-muted);font-size:10px">${type}</small></div>`;
            cont.appendChild(d);
        }

        // ЧАТЫ И СООБЩЕНИЯ
        function select(id, name, type) {
            active = { id, name, type }; 
            document.getElementById('hTitle').innerText = name.replace(" (ЗАБЛОКИРОВАН)", "").replace(" 📒", ""); 
            document.getElementById('msgBox').innerHTML = "";
            const hAv = document.getElementById('hAv');
            
            // Проверка блокировки
            const isBlockedByMe = cache.blocked[id];
            document.getElementById('blockOverlay').style.display = (type === 'USER' && isBlockedByMe) ? 'flex' : 'none';
            document.getElementById('msgInp').disabled = (type === 'USER' && isBlockedByMe);

            if(type === 'USER') {
                const uD = getUserDisplayData(id);
                hAv.src = uD.avatar; hAv.style.display = 'block';
                document.getElementById('hDesc').innerText = uD.isContact ? "Мой Контакт" : "Пользователь";
            } else {
                hAv.src = cache.g[id].avatar || `https://api.dicebear.com/7.x/shapes/svg?seed=${id}`; hAv.style.display = 'block';
                document.getElementById('hDesc').innerText = "Группа";
            }

            const path = type === 'USER' ? (myID < id ? myID+"_"+id : id+"_"+myID) : id;
            db.ref("msgs/" + path).off();
            db.ref("msgs/" + path).on("value", snapshot => {
                document.getElementById('msgBox').innerHTML = "";
                snapshot.forEach(child => {
                    const m = child.val(); 
                    
                    // Если собеседник меня заблокировал (или я его) - можно скрыть сообщения, но оставим как есть, заглушка сверху всё закрывает.
                    
                    const div = document.createElement('div');
                    div.className = 'msg ' + (m.sid === myID ? 'me' : 'he');
                    
                    // Для групп выводим имена, для ЛС - нет нужды, но для совместимости оставим
                    let displayNick = m.snick;
                    if (m.sid !== myID && type === 'USER') displayNick = getUserDisplayData(m.sid).name;
                    
                    div.innerHTML = `<div class="msg-name">${displayNick} ${m.sid === myID ? `<span class="msg-del" onclick="deleteMessage('${path}', '${child.key}')">🗑️</span>` : ""}</div>${m.txt}`;
                    document.getElementById('msgBox').appendChild(div);
                });
                document.getElementById('msgBox').scrollTop = document.getElementById('msgBox').scrollHeight;
            });
        }

        function sendMsg() {
            const t = document.getElementById('msgInp').value.trim(); if (!t || !active) return;
            // Анти-втык: если заблокирован
            if (active.type === 'USER' && cache.blocked[active.id]) return alert("Вы заблокировали этого пользователя!");

            const path = active.type === 'USER' ? (myID < active.id ? myID+"_"+active.id : active.id+"_"+myID) : active.id;
            db.ref("msgs/" + path).push().set({ sid: myID, snick: document.getElementById('myName').innerText, txt: t });
            document.getElementById('msgInp').value = "";
        }

        function deleteMessage(path, key) { if(confirm("Удалить?")) db.ref("msgs/" + path + "/" + key).remove(); }

        // ПРОФИЛИ, КОНТАКТЫ, БЛОКИРОВКИ
        let viewingUserId = "";
        
        function openMe() {
            const d = cache.u[myID]; if(!d) return;
            document.getElementById('myNickNew').value = d.nickname; document.getElementById('myAvNew').value = d.avatar || "";
            document.getElementById('myAvPreview').src = d.avatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${myID}`;
            loadDevices();
            document.getElementById('my-prof-modal').style.display='flex';
        }
        function updateMe() {
            db.ref("users/"+myID).update({ nickname: document.getElementById('myNickNew').value, avatar: document.getElementById('myAvNew').value }).then(() => { alert("Сохранено!"); closeM('my-prof-modal'); });
        }

        function openUserCardFromHeader() {
            if(active && active.type === 'USER') {
                viewingUserId = active.id;
                const dData = getUserDisplayData(viewingUserId);
                
                document.getElementById('pCardAv').src = dData.avatar;
                document.getElementById('pCardNick').innerText = dData.name;
                
                // Чекбокс контактов
                const isC = cache.contacts[viewingUserId];
                document.getElementById('isContact').checked = !!isC;
                document.getElementById('contactSettings').style.display = isC ? 'block' : 'none';
                if(isC) {
                    document.getElementById('contactLocName').value = isC.locName || "";
                    document.getElementById('contactLocAv').value = isC.locAv || "";
                } else {
                    document.getElementById('contactLocName').value = ""; document.getElementById('contactLocAv').value = "";
                }

                // Кнопка блокировки
                const isB = cache.blocked[viewingUserId];
                const bBtn = document.getElementById('blockBtn');
                bBtn.innerText = isB ? "✅ Разблокировать пользователя" : "🚫 Заблокировать пользователя";
                bBtn.className = isB ? "success" : "danger";

                document.getElementById('user-prof-modal').style.display = 'flex';
            }
        }

        function toggleContactSettings() {
            document.getElementById('contactSettings').style.display = document.getElementById('isContact').checked ? 'block' : 'none';
            if (!document.getElementById('isContact').checked) {
                // Удаляем из контактов
                db.ref(`users/${myID}/contacts/${viewingUserId}`).remove().then(() => { render(); select(active.id, active.name, active.type); });
            }
        }

        function saveContact() {
            const locN = document.getElementById('contactLocName').value.trim();
            const locA = document.getElementById('contactLocAv').value.trim();
            db.ref(`users/${myID}/contacts/${viewingUserId}`).set({ locName: locN, locAv: locA }).then(() => {
                alert("Контакт обновлен!"); render(); closeM('user-prof-modal'); select(active.id, getUserDisplayData(active.id).name, active.type);
            });
        }

        function toggleBlock() {
            const isB = cache.blocked[viewingUserId];
            if (isB) {
                db.ref(`users/${myID}/blocked/${viewingUserId}`).remove().then(() => { render(); closeM('user-prof-modal'); select(active.id, active.name, active.type); });
            } else {
                if(confirm("Уверены, что хотите кинуть его в блок? Он не сможет писать, чат будет скрыт.")) {
                    db.ref(`users/${myID}/blocked/${viewingUserId}`).set(true).then(() => { render(); closeM('user-prof-modal'); select(active.id, active.name, active.type); });
                }
            }
        }

        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        // БАЗОВАЯ РЕГИСТРАЦИЯ И ВХОД (минимизировано для примера)
        function login() { const e=document.getElementById('uEmail').value, p=document.getElementById('uPass').value; authSystem.signInWithEmailAndPassword(e, p).catch(err=>alert(err.message)); }
        function register() {
            const e=document.getElementById('regEmail').value, p=document.getElementById('regPass').value, n=document.getElementById('uNick').value, pin=document.getElementById('regPin').value;
            authSystem.createUserWithEmailAndPassword(e, p).then(c => { db.ref("users/"+c.user.uid).set({ nickname: n, avatar:"", pin: pin||"" }); }).catch(err=>alert(err.message));
        }
        function verifyPin() {
            const p = document.getElementById('authPinInp').value;
            db.ref("users/"+myID+"/pin").once("value", s => { if(s.val()===p) { sessionStorage.setItem('vchat_pin_pass','true'); document.getElementById('login-scr').style.display='none'; document.getElementById('app').style.display='flex'; registerSession(); } else alert("Неверный ПИН!"); });
        }
        function loginWithGoogle() { authSystem.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logOut() { authSystem.signOut().then(()=>location.reload()); }
        function newG() { const n=prompt("Имя группы:"); if(n) db.ref("groups/grp_"+Date.now()).set({name:n, roles:{[myID]:'owner'}}); }
    </script>
</body>
</html>
